<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Teacher — المعلم الذكي</title>
<meta name="description" content="منصّة اختبارات ذكية: يُنشئ الأستاذ(ة) الاختبار، ويطبعه التلميذ(ة) ويجيب عليه ويصوّره، ويظهر التصحيح فورًا.">
<meta name="theme-color" content="#efe3bf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Rakkas&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#efe3bf; --bg2:#e7d9a8; --panel:#fffcf3; --panel2:#fbf1d6; --panel-solid:#fffdf6;
    --line:rgba(151,111,20,.25); --line-strong:rgba(151,111,20,.48);
    --ink:#3c2f16; --dim:#8d7c50;
    --gold:#c9982f; --lav:#2f5d43; --teal:#3f7d5c; --rose:#b5563a; --red:#b5432a;
    --gold-deep:#a97a1c; --gold-light:#f2da96; --green-deep:#1f4530;
    --paper:#fbf3da; --paperink:#3c2f16;
    --radius:20px;
    --ease:cubic-bezier(.4,0,.2,1);
    font-family:'IBM Plex Sans Arabic',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);min-height:100vh;}
  body{
    background:
      radial-gradient(ellipse 900px 520px at 15% -6%, rgba(201,152,47,.20), transparent 60%),
      radial-gradient(ellipse 800px 540px at 105% 8%, rgba(47,93,67,.14), transparent 60%),
      radial-gradient(ellipse 700px 480px at 50% 115%, rgba(201,152,47,.16), transparent 60%),
      repeating-linear-gradient(45deg, rgba(151,111,20,.05) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(-45deg, rgba(151,111,20,.05) 0 2px, transparent 2px 34px),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment:fixed;
    min-height:100vh;
  }
  h1,h2,h3,.disp{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
  .wrap{max-width:600px;margin:0 auto;padding:22px 18px 70px;min-height:100vh;}

  /* ===== Ornate hero (landing top identity) ===== */
  .hero-frame{
    position:relative;border:1.5px solid var(--line-strong);border-radius:26px;
    padding:30px 22px 24px;margin-bottom:18px;text-align:center;overflow:hidden;
    box-shadow:0 18px 44px rgba(90,66,10,.14), inset 0 1px 0 rgba(255,255,255,.6);
    background-image:url('hero-bg.jpg'); background-size:cover; background-position:center 28%;
  }
  .hero-frame::before,.hero-frame::after{
    content:'';position:absolute;top:10px;width:34px;height:34px;border-top:2px solid var(--gold);
    opacity:.85;z-index:2;
  }
  .hero-frame::before{left:10px;border-right:2px solid var(--gold);border-top-right-radius:12px;}
  .hero-frame::after{right:10px;border-left:2px solid var(--gold);border-top-left-radius:12px;}
  .hero-fade{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(90deg, transparent 0%, rgba(239,227,191,.5) 14%, rgba(239,227,191,.93) 26%, rgba(239,227,191,.93) 74%, rgba(239,227,191,.5) 86%, transparent 100%),
      linear-gradient(180deg, rgba(239,227,191,.55) 0%, transparent 12%, transparent 88%, rgba(231,217,168,.6) 100%);
  }
  .hero-content{position:relative;z-index:2;}
  .hero-seal{
    width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    font-size:34px;background:radial-gradient(circle at 35% 30%, #fff8e4, var(--panel2));
    border:2.5px solid var(--gold); box-shadow:0 8px 20px rgba(169,122,28,.28);
  }
  .hero-title{font-family:'Rakkas',serif;font-weight:400;font-size:26px;color:var(--green-deep);margin-bottom:6px;line-height:1.5;}
  .hero-sub{font-size:12.5px;color:var(--dim);margin-bottom:14px;}
  .hero-pill{
    display:inline-block;background:linear-gradient(135deg,var(--lav),var(--green-deep));color:#fdf8e4;
    border-radius:999px;padding:7px 20px;font-size:13.5px;font-weight:600;box-shadow:0 6px 16px rgba(31,69,48,.28);
  }
  .hero-divider{margin-top:14px;color:var(--gold);letter-spacing:8px;font-size:13px;opacity:.8;}

  /* ===== Hero icon with glow + flowing feature steps ===== */
  .hero-icon-wrap{position:relative;width:110px;height:110px;margin:0 auto 4px;}
  .hero-icon-glow{
    position:absolute;inset:-14px;border-radius:36px;
    background:radial-gradient(circle, rgba(63,125,92,.35), rgba(201,152,47,.28) 55%, transparent 75%);
    filter:blur(10px);opacity:.9;animation:heroPulse 3.2s ease-in-out infinite;
  }
  @keyframes heroPulse{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}
  .hero-icon-img{
    position:relative;width:110px;height:110px;border-radius:26px;display:block;
    box-shadow:0 10px 26px rgba(90,66,10,.28), 0 0 0 1px rgba(255,255,255,.5) inset;
  }
  .hero-flow{
    position:relative;width:2px;height:26px;margin:2px auto 0;
    background:linear-gradient(180deg, var(--gold), var(--teal));
    opacity:.7;
  }
  .hero-flow::before,.hero-flow::after{
    content:'';position:absolute;top:0;width:1px;height:100%;
    background:linear-gradient(180deg, rgba(201,152,47,.6), rgba(63,125,92,.5));
    filter:blur(2px);
  }
  .hero-flow::before{left:-7px;} .hero-flow::after{right:-7px;}
  .hero-steps{display:flex;flex-direction:column;gap:9px;margin:6px 0 16px;}
  .hero-step{
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:linear-gradient(135deg, rgba(255,255,255,.55), rgba(251,241,214,.45));
    border:1px solid rgba(151,111,20,.22);border-radius:14px;padding:10px 16px;
    font-size:13.5px;font-weight:600;color:var(--green-deep);
    box-shadow:0 6px 14px rgba(90,66,10,.08), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter:blur(3px);
  }
  .hero-step-ico{font-size:16px;line-height:1;}
  .hero-pitch{
    font-size:13.5px;line-height:1.95;color:var(--ink);text-align:center;
    background:linear-gradient(135deg, rgba(255,255,255,.55), rgba(251,241,214,.45));
    border:1px solid rgba(151,111,20,.22);border-radius:14px;padding:15px 18px;margin:6px 0 16px;
    box-shadow:0 6px 14px rgba(90,66,10,.08), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter:blur(3px);
  }

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .seal{
    width:46px;height:46px;border-radius:50%;flex:none;position:relative;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:19px;color:var(--gold-deep);
    background:radial-gradient(circle at 35% 30%, #fff8e4, var(--panel2));
  }
  .seal::before{
    content:'';position:absolute;inset:-3px;border-radius:50%;padding:2px;
    background:conic-gradient(from 0deg, var(--gold), var(--lav), var(--gold-light), var(--gold));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:sealspin 9s linear infinite;
    z-index:-1;
  }
  .seal::after{
    content:'';position:absolute;inset:-7px;border-radius:50%;
    box-shadow:0 0 16px 2px rgba(201,152,47,.35);pointer-events:none;
    z-index:-1;
  }
  @keyframes sealspin{to{transform:rotate(360deg);}}
  .brand-name{font-family:'Rakkas',serif;font-weight:400;font-size:21px;color:var(--green-deep);letter-spacing:0;}
  .brand-sub{
    display:inline-block;margin-top:3px;font-size:11px;color:var(--panel-solid);letter-spacing:.02em;
    background:var(--lav);border-radius:999px;padding:2px 11px;
  }
  .card{
    background:var(--panel);
    border:1.5px solid var(--line); border-top-color:var(--line-strong);
    border-radius:var(--radius);padding:22px;margin-bottom:16px;
    box-shadow:0 14px 36px rgba(90,66,10,.12), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .btn{
    font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;border:none;border-radius:999px;
    padding:13px 22px;cursor:pointer;font-size:15px;
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
  .btn:active{transform:scale(.97) translateY(0);}
  .btn-primary{background:linear-gradient(135deg,var(--lav),var(--green-deep));color:#fdf8e4;box-shadow:0 8px 20px rgba(31,69,48,.32);}
  .btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));color:#3c2708;box-shadow:0 8px 20px rgba(169,122,28,.32);}
  .btn-teal{background:linear-gradient(135deg,var(--teal),#2b5c41);color:#f4fbf6;box-shadow:0 8px 20px rgba(63,125,92,.28);}
  .btn-ghost{background:var(--panel-solid);color:var(--ink);border:1.5px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--gold-deep);}
  .btn-danger{background:rgba(181,67,42,.08);color:var(--red);border:1.5px solid rgba(181,67,42,.35);}
  .btn:disabled{opacity:.42;cursor:not-allowed;transform:none;}
  .btn-block{width:100%;justify-content:center;}
  input[type=text],input[type=number],textarea,select{
    width:100%;background:var(--panel-solid);border:1.5px solid var(--line);color:var(--ink);
    border-radius:14px;padding:13px 15px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(201,152,47,.20);
  }
  textarea{resize:vertical;min-height:70px;}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:7px;font-weight:600;letter-spacing:.01em;}
  .field{margin-bottom:15px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:140px;}
  .muted{color:var(--dim);font-size:13.5px;line-height:1.9;}
  .pill{display:inline-block;background:rgba(47,93,67,.09);border:1px solid rgba(47,93,67,.30);color:var(--lav);border-radius:999px;padding:4px 13px;font-size:12px;font-weight:600;}
  .center{text-align:center;}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:560px){.choice-grid{grid-template-columns:1fr;}}
  .choice-card{
    background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:30px 20px;text-align:center;cursor:pointer;
    transition:transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);
  }
  .choice-card:hover{border-color:var(--gold-deep);transform:translateY(-4px);box-shadow:0 16px 40px rgba(169,122,28,.20);}
  .choice-card .ico{font-size:34px;margin-bottom:10px;}

  /* ===== exam feed grid (landing) — compact tiles, several per row, wrapping to new rows ===== */
  #examsFeed{display:grid;grid-template-columns:repeat(auto-fill, minmax(128px,1fr));gap:10px;}
  .exam-card{
    background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
    padding:12px 10px;position:relative;cursor:pointer;text-align:center;
    transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .exam-card:hover{border-color:var(--gold-deep);transform:translateY(-2px);box-shadow:0 10px 26px rgba(169,122,28,.16);}
  .exam-card .ico{
    width:36px;height:36px;margin:0 auto 8px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:17px;background:linear-gradient(135deg,var(--gold-light),var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .exam-card .t{
    font-weight:700;font-size:13px;color:var(--ink);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .exam-card .s{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .exam-card.active-topic{border-color:var(--gold-deep);box-shadow:0 0 0 2px rgba(201,152,47,.25);}
  .exam-card .exam-hide{position:absolute;top:4px;left:4px;background:none;border:none;color:var(--dim);font-size:14px;cursor:pointer;padding:3px;line-height:1;}

  /* ===== exam rows (used elsewhere, e.g. teacher's topic/result picker) — icon + title + badge ===== */
  .exam-row{
    display:flex;align-items:center;gap:14px;background:var(--panel);border:1.5px solid var(--line);
    border-radius:16px;padding:14px 16px;margin-bottom:12px;position:relative;cursor:pointer;
    transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .exam-row:hover{border-color:var(--gold-deep);transform:translateY(-2px);box-shadow:0 10px 26px rgba(169,122,28,.16);}
  .exam-ico{
    width:48px;height:48px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:linear-gradient(135deg,var(--gold-light),var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .exam-info{flex:1;min-width:0;}
  .exam-info .t{font-weight:700;font-size:15.5px;color:var(--ink);}
  .exam-info .s{font-size:12px;color:var(--dim);margin-top:2px;}
  .exam-row.active-topic{border-color:var(--gold-deep);box-shadow:0 0 0 2px rgba(201,152,47,.25);}
  .exam-hide{background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;flex:none;padding:4px;}

  .tabbar{display:flex;gap:8px;margin-bottom:16px;border-bottom:1.5px solid var(--line);}
  .tabbtn{
    background:none;border:none;cursor:pointer;padding:10px 4px;font-family:'IBM Plex Sans Arabic',sans-serif;
    font-weight:600;font-size:14.5px;color:var(--dim);position:relative;margin-left:18px;
    transition:color .18s var(--ease);
  }
  .tabbtn::after{content:'';position:absolute;left:0;right:0;bottom:-1.5px;height:3px;border-radius:3px;background:transparent;transition:background .18s var(--ease);}
  .tabbtn.active{color:var(--green-deep);}
  .tabbtn.active::after{background:linear-gradient(90deg,var(--gold),var(--lav));}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .qcard{
    background:var(--panel2);border:1.5px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px;position:relative;
  }
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .qnum{background:rgba(47,93,67,.12);border:1px solid rgba(47,93,67,.4);color:var(--lav);font-weight:700;border-radius:8px;padding:3px 11px;font-size:13px;}
  .toolbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold-deep);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loadbox{display:flex;align-items:center;gap:12px;color:var(--dim);padding:16px 0;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-solid);border:1.5px solid var(--line-strong);color:var(--ink);padding:12px 20px;border-radius:14px;font-size:14px;z-index:999;
    box-shadow:0 10px 30px rgba(90,66,10,.28);
  }
  .link-box{display:flex;gap:8px;background:rgba(201,152,47,.08);border:1px dashed rgba(201,152,47,.5);border-radius:12px;padding:11px 13px;align-items:center;}
  .link-box input{border:none;background:transparent;color:var(--gold-deep);font-family:'IBM Plex Sans Arabic',monospace;font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);}
  th{color:var(--dim);font-size:12px;font-weight:600;}
  .rank1{color:var(--gold-deep);font-weight:800;}
  .rank2{color:#6b6350;font-weight:700;}
  .rank3{color:#9c7a3f;font-weight:700;}
  .score-big{font-family:'Rakkas',serif;font-weight:400;font-size:54px;color:var(--gold-deep);text-align:center;text-shadow:0 2px 14px rgba(169,122,28,.25);}
  .qa-block{border-right:3px solid var(--line);padding-right:13px;margin-bottom:14px;}
  .qa-block.ok{border-color:var(--teal);}
  .qa-block.mid{border-color:var(--gold-deep);}
  .qa-block.bad{border-color:var(--red);}
  .drop{border:2px dashed var(--line-strong);border-radius:14px;padding:20px;text-align:center;cursor:pointer;color:var(--dim);}
  .drop.filled{border-color:var(--teal);color:var(--teal);}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);}
  .suggest-wrap{position:relative;}
  .suggest-drop{
    position:absolute;top:100%;right:0;left:0;background:var(--panel-solid);
    border:1.5px solid var(--line-strong);border-radius:14px;margin-top:6px;max-height:220px;overflow-y:auto;z-index:50;
    box-shadow:0 16px 36px rgba(90,66,10,.22);
  }
  .suggest-item{padding:11px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s var(--ease);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover, .suggest-item:active{background:rgba(47,93,67,.08);color:var(--lav);}
  a.plain{color:var(--lav);text-decoration:none;font-weight:600;}
  .backlink{
    display:inline-flex;align-items:center;gap:6px;color:var(--dim);text-decoration:none;font-size:13px;
    transition:color .15s var(--ease), border-color .15s var(--ease); background:var(--panel-solid);
    border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;
  }
  .backlink:hover{color:var(--green-deep);border-color:var(--gold-deep);}
  .modal-bg{position:fixed;inset:0;background:rgba(60,47,22,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal{background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:88vh;overflow:auto;}

  :focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:6px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
    .seal::before{animation:none;}
  }

  /* Printable exam sheet */
  #printArea{position:fixed;top:0;left:-10000px;width:210mm;background:#fff;}
  .sheet{background:var(--paper);color:var(--paperink);border-radius:10px;padding:30px 26px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--paperink);padding-bottom:12px;margin-bottom:16px;}
  .sheet-title{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:23px;}
  .sheet-meta{font-size:12px;color:#5a5170;}
  .nameline{border-bottom:1px solid #8b8299;display:inline-block;min-width:180px;}
  .sheet-q{margin-bottom:18px;page-break-inside:avoid;}
  .sheet-qhead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;}
  .ruled{border-bottom:1px dotted #8b8299;height:26px;}
  .sheet-passage{border:1px solid #8b8299;border-radius:8px;padding:12px 14px;margin-bottom:18px;page-break-inside:avoid;}
  .sheet-passage-title{font-weight:700;margin-bottom:6px;}
  .sheet-passage-text{font-size:14px;line-height:1.9;white-space:pre-wrap;}
  .pcard{background:var(--panel2);border:1.5px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px;position:relative;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;}
    .sheet{background:#fff;color:#000;border-radius:0;padding:14mm;}
    .sheet-head{border-color:#000;}
    .ruled{border-color:#000;}
    .sheet-passage{border-color:#000;}
  }
</style>

function withTimeout(promise, ms, onTimeout){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=>{ if(onTimeout) onTimeout(); reject(new Error('انتهت مهلة الانتظار')); }, ms))
  ]);
}

function attachSuggestions(inputEl, options, onPick){
  const wrap = document.createElement('div');
  wrap.className = 'suggest-wrap';
  inputEl.parentNode.insertBefore(wrap, inputEl);
  wrap.appendChild(inputEl);
  const drop = document.createElement('div');
  drop.className = 'suggest-drop';
  drop.style.display = 'none';
  wrap.appendChild(drop);

  function renderDrop(filterText){
    const f = (filterText||'').trim().toLowerCase();
    const list = f ? options.filter(o=>o.toLowerCase().includes(f)) : options;
    if(list.length===0){ drop.style.display='none'; return; }
    drop.innerHTML = list.map(o=>`<div class="suggest-item" data-val="${esc(o)}">${esc(o)}</div>`).join('');
    drop.style.display = 'block';
    drop.querySelectorAll('.suggest-item').forEach(it=>{
      it.addEventListener('mousedown', (e)=>{ // mousedown fires before blur
        e.preventDefault();
        inputEl.value = it.dataset.val;
        drop.style.display = 'none';
        if(onPick) onPick(it.dataset.val);
      });
    });
  }
  inputEl.addEventListener('focus', ()=> renderDrop(inputEl.value));
  inputEl.addEventListener('input', ()=>{ renderDrop(inputEl.value); if(onPick) onPick(inputEl.value); });
  inputEl.addEventListener('blur', ()=> setTimeout(()=>{ drop.style.display='none'; }, 150));
}
function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
// downscale + return {base64, mediaType}
function dataUrlToResizedBase64(dataUrl, maxDim=1100, mime='image/jpeg', quality=0.72){
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){
        const ratio = Math.min(maxDim/w, maxDim/h);
        w = Math.round(w*ratio); h = Math.round(h*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const out = canvas.toDataURL(mime, quality);
      res({ base64: out.split(',')[1], mediaType: mime });
    };
    img.src = dataUrl;
  });
}
async function fileToImageBlock(file, maxDim=1100){
  const durl = await fileToDataUrl(file);
  const {base64, mediaType} = await dataUrlToResizedBase64(durl, maxDim);
  return { type:'image', source:{ type:'base64', media_type: mediaType, data: base64 } };
}
async function pdfFileToImageBlocks(file, maxPages=14){
  const buf = await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const blocks = [];
  const n = Math.min(pdf.numPages, maxPages);
  for(let i=1;i<=n;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.6});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    const durl = canvas.toDataURL('image/png');
    const {base64, mediaType} = await dataUrlToResizedBase64(durl, 1100, 'image/jpeg', 0.72);
    blocks.push({ type:'image', source:{ type:'base64', media_type: mediaType, data: base64 } });
  }
  return blocks;
}

function extractJSON(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('{'); const end = t.lastIndexOf('}');
  if(start>=0 && end>start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

/* Calls Claude, auto-continuing if truncated by max_tokens, until stop_reason isn't max_tokens or cap hit. */
async function callClaude(system, userContent, {maxLoops=8}={}){
  let messages = [{ role:'user', content: userContent }];
  let full = '';
  for(let i=0;i<maxLoops;i++){
    let resp;
    try{
      resp = await fetch(getClaudeApiUrl(), {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens: 1000,
          system,
          messages
        })
      });
    }catch(networkErr){
      if(i < maxLoops-1){
        await new Promise(r=>setTimeout(r, 1800));
        continue;
      }
      throw new Error('تعذّر الوصول إلى الخادم (' + getClaudeApiUrl() + ') بعد عدة محاولات. يرجى التأكد من استقرار الاتصال بالإنترنت. التفاصيل: ' + networkErr.message);
    }
    let data;
    const rawText = await resp.text();
    try{ data = JSON.parse(rawText); }
    catch(parseErr){
      throw new Error('الخادم رجع جواب غير متوقع (status ' + resp.status + '): ' + rawText.slice(0,300));
    }
    if(!resp.ok || data.error){
      const msg = typeof data.error === 'string' ? data.error : (data.error?.message || JSON.stringify(data));
      const transient = resp.status===503 || resp.status===429 || resp.status===500 || /high demand|overloaded|unavailable/i.test(msg);
      if(transient && i < maxLoops-1){
        await new Promise(r=>setTimeout(r, 1800));
        continue;
      }
      throw new Error('خطأ من الخادم (status ' + resp.status + '): ' + msg);
    }
    const textPart = (data.content||[]).map(b=>b.type==='text'?b.text:'').join('');
    full += textPart;
    if(data.stop_reason === 'max_tokens'){
      messages = [
        { role:'user', content:userContent },
        { role:'assistant', content: full },
        { role:'user', content: 'تابع بالضبط من حيث توقفت، بلا ما تعيد شي حاجة سبق كتبتيها، وبلا مقدمات.' }
      ];
      continue;
    }
    break;
  }
  return full;
}

  tabBtns.forEach(btn=>{
    btn.onclick = ()=>{
      tabBtns.forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    };

  const listBox = document.getElementById('examsList');
  const subPanel = document.getElementById('submissionsPanel');
  const searchBox = document.getElementById('subjectSearch');
  const levelBox = document.getElementById('levelSearch');
  attachSuggestions(levelBox, ALL_LEVELS, (val)=> renderGrouped(searchBox.value, val));
  attachSuggestions(searchBox, STANDARD_SUBJECTS, (val)=> renderGrouped(val, levelBox.value));

  if(mine.length===0){ listBox.innerHTML = 'لا توجد اختبارات بعد. اضغط على "اختبار جديد" للبدء.'; return; }

  let allExams = [];
  try{
    const results = await Promise.all(mine.map(async id=>{
      try{
        const doc = await db.collection('exams').doc(id).get();
        if(!doc.exists) return null;
        const data = doc.data();
        return { id, title: data.title||id, level: data.level||'', subject: data.subject||'بلا مادة', questionsCount: data.questions?.length||0, totalPoints: data.totalPoints||0, examData: data };
      }catch(e){ return null; }
    }));
    allExams = results.filter(Boolean);
  }catch(e){
    listBox.innerHTML = `<span style="color:var(--red);">تعذّر تحميل الاختبارات (${esc(e.message||'')}).</span>`;

  // يعرض لائحة التلاميذ الذين أجابوا على موضوع معيّن، مع نقطهم وأزرار فتح/تنزيل تصحيحهم PDF
  async function openTopicSubmissions(examEntry){
    listBox.querySelectorAll('.exam-row').forEach(r=>r.classList.remove('active-topic'));
    const rowEl = listBox.querySelector(`[data-topic="${examEntry.id}"]`);
    if(rowEl) rowEl.classList.add('active-topic');
    subPanel.innerHTML = `<div class="card"><div class="loadbox"><div class="spinner"></div> جارٍ تحميل إجابات التلاميذ...</div></div>`;
    try{
      const snap = await db.collection('exams').doc(examEntry.id).collection('submissions').orderBy('score','desc').get();
      if(snap.empty){
        subPanel.innerHTML = `<div class="card"><p class="muted">لا توجد إجابات مرسَلة بعد لموضوع "${esc(examEntry.title)}".</p></div>`;
        return;
      }
      subPanel.innerHTML = `
        <div class="card">
          <h3 style="margin-top:0;">📋 ${esc(examEntry.title)} — إجابات التلاميذ (${snap.size})</h3>
          <table>
            <thead><tr><th>التلميذ(ة)</th><th>النقطة</th><th>التصحيح</th></tr></thead>
            <tbody id="subRows"></tbody>
          </table>
        </div>`;
      const tbody = subPanel.querySelector('#subRows');
      snap.docs.forEach((d,i)=>{
        const s = d.data();
        const cls = i===0?'rank1':i===1?'rank2':i===2?'rank3':'';
        const tr = el(`<tr>
          <td>${esc(s.studentName)}</td>
          <td class="${cls}">${s.score}/${s.totalPoints}</td>
          <td>
            <button class="btn btn-ghost" data-act="open" style="padding:6px 10px;font-size:13px;">👁️ فتح</button>
            <button class="btn btn-gold" data-act="dl" style="padding:6px 10px;font-size:13px;">⬇️ تنزيل</button>
          </td>
        </tr>`);
        tbody.appendChild(tr);
        bindCorrectionButtons(tr, examEntry.examData, s);
      });
    }catch(e){
      subPanel.innerHTML = `<div class="card"><span style="color:var(--red);">تعذّر تحميل الإجابات (${esc(e.message||'')}).</span></div>`;
    }
  }

  function renderGrouped(filterText, levelValue){
    const f = (filterText||'').trim().toLowerCase();
    const lv = levelValue||'';
    let filtered = f ? allExams.filter(ex =>
      ex.subject.toLowerCase().includes(f) || ex.title.toLowerCase().includes(f)
    ) : allExams;
    if(lv){ const lvf=lv.trim().toLowerCase(); filtered = filtered.filter(ex=>(ex.level||'').toLowerCase().includes(lvf)); }

    subPanel.innerHTML = '';
    if(filtered.length===0){ listBox.innerHTML = '<p class="muted">لا توجد نتائج مطابقة.</p>'; return; }

    const levelGroups = {};
    filtered.forEach(ex=>{
      const lvKey = ex.level || 'بلا مستوى';
      if(!levelGroups[lvKey]) levelGroups[lvKey] = [];
      levelGroups[lvKey].push(ex);
    });
    const levelNames = Object.keys(levelGroups).sort((a,b)=>{
      const ia = ALL_LEVELS.indexOf(a), ib = ALL_LEVELS.indexOf(b);
      if(ia===-1 && ib===-1) return a.localeCompare(b,'ar');
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });

    listBox.innerHTML = levelNames.map(lvName=>{
      const groups = {};
      levelGroups[lvName].forEach(ex=>{
        if(!groups[ex.subject]) groups[ex.subject] = [];
        groups[ex.subject].push(ex);
      });
      const subjectNames = Object.keys(groups).sort((a,b)=>{
        const ia = STANDARD_SUBJECTS.indexOf(a), ib = STANDARD_SUBJECTS.indexOf(b);
        if(ia===-1 && ib===-1) return a.localeCompare(b,'ar');
        if(ia===-1) return 1;
        if(ib===-1) return -1;
        return ia-ib;
      });
      return `
        <div style="margin-bottom:22px;">
          <div class="hero-pill" style="margin-bottom:12px;">🎓 ${esc(lvName)}</div>
          ${subjectNames.map(subj=>`
            <div style="margin-bottom:14px;">
              <div style="font-weight:800;color:var(--gold-deep);margin-bottom:6px;">📚 ${esc(subj)} <span class="pill" style="margin-right:6px;">${groups[subj].length}</span></div>
              ${groups[subj].map(ex=>`
                <div class="exam-row" data-topic="${ex.id}" style="cursor:pointer;">
                  <div class="exam-ico">📘</div>
                  <div class="exam-info">
                    <div class="t">${esc(ex.title)}</div>
                    <div class="s">${ex.questionsCount} سؤال — ${ex.totalPoints} نقطة</div>
                  </div>
                  <button class="btn btn-ghost" data-manage="${ex.id}" style="padding:8px 12px;font-size:13px;" title="رابط المشاركة والحذف">⚙️</button>
                </div>`).join('')}
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
    listBox.querySelectorAll('[data-topic]').forEach(rowEl=>{
      rowEl.onclick = (e)=>{
        if(e.target.closest('[data-manage]')) return;
        const ex = allExams.find(x=>x.id===rowEl.dataset.topic);
        if(ex) openTopicSubmissions(ex);
      };
    });
    listBox.querySelectorAll('[data-manage]').forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); openExamPanel(b.dataset.manage); };
    });
  }

  renderGrouped('', '');
}

// يحذف اختبارًا مع كل إجاباته المرسلة (لا يمكن التراجع عن هذا الإجراء)
async function deleteExamCompletely(examId){
  const subRef = db.collection('exams').doc(examId).collection('submissions');
  const subDocs = await subRef.get();
  const batchDeletes = subDocs.docs.map(d=>d.ref.delete());
  await Promise.all(batchDeletes);
  await db.collection('exams').doc(examId).delete();
}

      if(!prompt){ toast('يرجى كتابة وصف للسؤال المطلوب'); return; }
      const btn = document.getElementById('genQ');
      btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> جارٍ التوليد...`;
      try{
        const system = `أنت مساعد يُعِدّ أسئلة اختبارات مدرسية. أخرج JSON فقط بهذا الشكل: {"text":"نص السؤال","points":1,"modelAnswer":"الحل النموذجي","expectedLines":3}. المادة: ${d.subject}. لا تكتب أي شيء خارج الـ JSON.`;
        const raw = await callClaude(system, [{type:'text', text: prompt}]);
        const q = extractJSON(raw);
        d.questions.push({number:d.questions.length+1, text:q.text||'', points:q.points??1, modelAnswer:q.modelAnswer||'', expectedLines:q.expectedLines??3});
        document.getElementById('aiExtra').value='';
        renderQList();
        toast('تمت إضافة السؤال ✅');
      }catch(e){ toast('تعذّر توليد السؤال، يرجى إعادة المحاولة'); }
      btn.disabled=false; btn.innerHTML='توليد السؤال';
    };
    document.getElementById('toStep3').onclick = ()=>{
      if(d.questions.length===0){ toast('يرجى إضافة سؤال واحد على الأقل'); return; }
      d.step = 3; renderTeacherCreate();
    };
  }

  else if(d.step===3){
    const total = d.questions.reduce((s,q)=>s+(parseFloat(q.points)||0),0);
    box.innerHTML = `
      <h3>جاهز للنشر</h3>
      <p class="muted"><b>${esc(d.title)}</b> — ${esc(d.level)} — ${esc(d.subject)} — ${d.questions.length} سؤال — من ${total} نقطة</p>
      <button class="btn btn-primary btn-block" id="publish">🖋️ نشر الاختبار</button>
      <button class="btn btn-ghost btn-block" id="backEdit" style="margin-top:10px;">⟵ رجوع للتعديل</button>
      <div id="pubMsg" style="margin-top:12px;"></div>
    `;
    document.getElementById('backEdit').onclick = ()=>{ d.step=2; renderTeacherCreate(); };
    document.getElementById('publish').onclick = async ()=>{
      const btn = document.getElementById('publish');
      btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> جاري النشر...`;
      try{
        const examId = uid(6);
        let examPdfUrl = null;
        if(d.examFile && storage){
          try{
            btn.innerHTML = `<span class="spinner"></span> جاري رفع ملف الاختبار الأصلي...`;
            const ref = storage.ref().child(`exams/${examId}/original.pdf`);
            const task = ref.put(d.examFile, {contentType:'application/pdf'});
            await withTimeout(task, 20000, ()=>{ try{ task.cancel(); }catch(_){} });
            examPdfUrl = await withTimeout(ref.getDownloadURL(), 10000);
          }catch(upErr){
            console.error('exam pdf upload failed/timed out — نُشر الاختبار بلا الملف الأصلي', upErr);
            // ما نوقفوش النشر إلا طوّل الرفع أو فشل — غير التلميذ مايشوفش الملف الأصلي
          }
        }
        btn.innerHTML = `<span class="spinner"></span> جاري النشر...`;
        await db.collection('exams').doc(examId).set({
          level: d.level, subject: d.subject, title: d.title,
          passages: d.passages || [],
          questions: d.questions.map((q,i)=>({...q, number:i+1})),
          totalPoints: total,
          examPdfUrl: examPdfUrl,
          teacherId: getTeacherId(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        const mine = JSON.parse(localStorage.getItem('myExams_v1')||'[]');
        mine.unshift(examId);
        localStorage.setItem('myExams_v1', JSON.stringify(mine));
        go('teacherExamView', {examId});
      }catch(e){
        document.getElementById('pubMsg').innerHTML = `<span style="color:var(--red);">صار خطأ فالنشر: ${esc(e.message||'')}</span>`;
        btn.disabled=false; btn.innerHTML='🖋️ نشر الاختبار';
      }
    };
  }
}

// نفس منطق wireCorrectionPdfButtons لكن يشتغل مباشرة على عنصر (صف جدول مثلاً) بلا الحاجة لِمعرّفات id
function bindCorrectionButtons(containerEl, ex, result){
  let cachedBlob = null;
  async function ensureBlob(){
    if(cachedBlob) return cachedBlob;
    cachedBlob = await generateCorrectionPdfBlob(ex, result);
    return cachedBlob;
  }
  const openBtn = containerEl.querySelector('[data-act="open"]');
  const dlBtn = containerEl.querySelector('[data-act="dl"]');
  if(openBtn) openBtn.onclick = async ()=>{
    openBtn.disabled = true; const orig = openBtn.innerHTML; openBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const blob = await ensureBlob();
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }catch(e){ toast('تعذّر فتح الملف: ' + (e.message||'')); }
    openBtn.disabled = false; openBtn.innerHTML = orig;
  };
  if(dlBtn) dlBtn.onclick = async ()=>{
    dlBtn.disabled = true; const orig = dlBtn.innerHTML; dlBtn.innerHTML = '<span class="spinner"></span>';
    try{
      const blob = await ensureBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `تصحيح-${sanitizeFileName(result.studentName)}-${sanitizeFileName(ex.title)}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ toast('تعذّر تنزيل الملف: ' + (e.message||'')); }
    dlBtn.disabled = false; dlBtn.innerHTML = orig;
  };
}

function buildPrintSheet(ex){
  const area = document.getElementById('printArea');
  const pHtml = (ex.passages||[]).map(p=>`
    <div class="sheet-passage">
      ${p.title?`<div class="sheet-passage-title">${esc(p.title)}</div>`:''}
      <div class="sheet-passage-text">${esc(p.text)}</div>
    </div>
  `).join('');
  const qHtml = ex.questions.map(q=>`
    <div class="sheet-q">
      <div class="sheet-qhead"><span>${q.number}. ${esc(q.text)}</span><span>(${q.points} ن)</span></div>
      ${Array.from({length: q.expectedLines||3}).map(()=>'<div class="ruled"></div>').join('')}
    </div>
  `).join('');
  area.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="sheet-title">${esc(ex.title)}</div>
          <div class="sheet-meta">${ex.level?esc(ex.level)+' — ':''}${esc(ex.subject)} — من ${ex.totalPoints} نقطة</div>
        </div>
        <div class="sheet-meta">الاسم: <span class="nameline">&nbsp;</span></div>
      </div>
      ${pHtml}
      ${qHtml}
    </div>
  `;
}

// ينشئ ملف PDF حقيقي من ورقة التصحيح (باستخدام html2canvas + jsPDF) ويرجعه كـ Blob
async function generateCorrectionPdfBlob(ex, result){
  buildCorrectionSheet(ex, result);
  await new Promise(r=>setTimeout(r, 60)); // إعطاء وقت للتخطيط قبل الالتقاط
  const sheetEl = document.querySelector('#printArea .sheet');
  const canvas = await html2canvas(sheetEl, {scale:2, backgroundColor:'#ffffff', useCORS:true});
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'px', format:[canvas.width, canvas.height] });
  pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
  return pdf.output('blob');
}

// نفس المبدأ ديال generateCorrectionPdfBlob لكن كيولّد PDF لنسخة الأسئلة والنصوص (بلا نتيجة تلميذ)
async function generateExamPdfBlob(ex){
  buildPrintSheet(ex);
  await new Promise(r=>setTimeout(r, 60));
  const sheetEl = document.querySelector('#printArea .sheet');
  const canvas = await html2canvas(sheetEl, {scale:2, backgroundColor:'#ffffff', useCORS:true});
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'px', format:[canvas.width, canvas.height] });
  pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
  return pdf.output('blob');
}

// يجهّز زوج أزرار "فتح PDF" و"تنزيل PDF" لنسخة الأسئلة (للأستاذ(ة))
function wireExamPdfButtons(openBtnId, downloadBtnId, ex){
  let cachedBlob = null;
  async function ensureBlob(){
    if(cachedBlob) return cachedBlob;
    cachedBlob = await generateExamPdfBlob(ex);
    return cachedBlob;
  }
  const openBtn = document.getElementById(openBtnId);
  const dlBtn = document.getElementById(downloadBtnId);
  if(openBtn) openBtn.onclick = async ()=>{
    openBtn.disabled = true; const orig = openBtn.innerHTML; openBtn.innerHTML = '<span class="spinner"></span> جارٍ التجهيز...';
    try{
      const blob = await ensureBlob();
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }catch(e){ toast('تعذّر فتح الملف: ' + (e.message||'')); }
    openBtn.disabled = false; openBtn.innerHTML = orig;
  };
  if(dlBtn) dlBtn.onclick = async ()=>{
    dlBtn.disabled = true; const orig = dlBtn.innerHTML; dlBtn.innerHTML = '<span class="spinner"></span> جارٍ التجهيز...';
    try{
      const blob = await ensureBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `أسئلة-${sanitizeFileName(ex.title)}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ toast('تعذّر تنزيل الملف: ' + (e.message||'')); }
    dlBtn.disabled = false; dlBtn.innerHTML = orig;
  };
}

function sanitizeFileName(s){
  return (s||'ملف').replace(/[\\/:*?"<>|]/g,'').trim().slice(0,60) || 'ملف';
}

// يجهّز زوج أزرار "فتح PDF" و"تنزيل PDF" ويربطهما بمنطق التوليد
function wireCorrectionPdfButtons(openBtnId, downloadBtnId, ex, result){
  let cachedBlob = null;
  async function ensureBlob(){
    if(cachedBlob) return cachedBlob;
    cachedBlob = await generateCorrectionPdfBlob(ex, result);
    return cachedBlob;
  }
  const openBtn = document.getElementById(openBtnId);
  const dlBtn = document.getElementById(downloadBtnId);
  if(openBtn) openBtn.onclick = async ()=>{
    openBtn.disabled = true; const orig = openBtn.innerHTML; openBtn.innerHTML = '<span class="spinner"></span> جارٍ التجهيز...';
    try{
      const blob = await ensureBlob();
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }catch(e){ toast('تعذّر فتح الملف: ' + (e.message||'')); }
    openBtn.disabled = false; openBtn.innerHTML = orig;
  };
  if(dlBtn) dlBtn.onclick = async ()=>{
    dlBtn.disabled = true; const orig = dlBtn.innerHTML; dlBtn.innerHTML = '<span class="spinner"></span> جارٍ التجهيز...';
    try{
      const blob = await ensureBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `تصحيح-${sanitizeFileName(result.studentName)}-${sanitizeFileName(ex.title)}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ toast('تعذّر تنزيل الملف: ' + (e.message||'')); }
    dlBtn.disabled = false; dlBtn.innerHTML = orig;
  };
}

function buildCorrectionSheet(ex, result){
  const byNumber = {};
  (ex.questions||[]).forEach(q=>{ byNumber[q.number] = q; });
  const qHtml = (result.perQuestion||[]).map(r=>{
    const q = byNumber[r.number] || {};
    const ratio = r.max ? r.awarded/r.max : 0;
    const mark = ratio>=0.99 ? '✓' : ratio<=0.01 ? '✗' : '~';
    return `
    <div class="sheet-q">
      <div class="sheet-qhead"><span>${r.number}. ${esc(q.text||'')}</span><span>${mark} ${r.awarded}/${r.max}</span></div>
      <div style="font-size:13px;margin:4px 0;"><b>إجابتك (مفرَّغة رقميًا):</b> ${esc(r.studentAnswerSummary||'—')}</div>
      ${r.feedback ? `<div style="font-size:12.5px;color:#5a5170;"><b>الملاحظة:</b> ${esc(r.feedback)}</div>` : ''}
    </div>`;
  }).join('');
  area.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="sheet-title">تصحيح: ${esc(ex.title)}</div>
          <div class="sheet-meta">${ex.level?esc(ex.level)+' — ':''}${esc(ex.subject)} — النتيجة: ${result.score} / ${result.totalPoints}</div>
        </div>
        <div class="sheet-meta">الاسم: ${esc(result.studentName)}</div>
      </div>
      ${result.overallFeedback ? `<p style="font-size:13px;margin-bottom:14px;">${esc(result.overallFeedback)}</p>` : ''}
      ${qHtml}
    </div>
  `;
}

/* ============================= STUDENT: RESULT ============================= */
function renderStudentResult(){
  const {result, examData} = state;
  const pct = examData.totalPoints? (result.score/examData.totalPoints*100):0;
  app.innerHTML = `
    ${Header('نتيجتك')}
    <div class="card center">
      <div class="muted">${esc(result.studentName)}</div>
      <div class="score-big">${result.score} / ${result.totalPoints}</div>
      <div class="pill">${pct.toFixed(0)}%</div>
      ${result.overallFeedback?`<p class="muted" style="margin-top:14px;">${esc(result.overallFeedback)}</p>`:''}
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="openCorrection">👁️ فتح PDF</button>
        <button class="btn btn-gold" id="downloadCorrection">⬇️ تنزيل PDF</button>
      </div>
    </div>
    <div class="card">
      <h3>تفاصيل التصحيح</h3>
      ${result.perQuestion.map(q=>{
        const ratio = q.max? q.awarded/q.max : 0;
        const cls = ratio>=0.8?'ok':ratio>=0.4?'mid':'bad';
        return `<div class="qa-block ${cls}">
          <b>سؤال ${q.number}</b> — ${q.awarded}/${q.max}<br>
          <span class="muted">إجابتك: ${esc(q.studentAnswerSummary||'')}</span><br>
          <span class="muted">${esc(q.feedback||'')}</span>
        </div>`;
      }).join('')}
    </div>
    <a class="backlink" href="${location.pathname}">⟵ الرئيسية</a>
  `;
  wireCorrectionPdfButtons('openCorrection', 'downloadCorrection', examData, result);
}

/* ============================= RENDER ROUTER ============================= */
function render(){
  document.getElementById('printArea').innerHTML='';
  switch(state.screen){
    case 'landing': renderLanding(); break;
    case 'teacherGate': renderTeacherGate(); break;
    case 'setup': renderSetup(); break;
    case 'teacherDashboard': renderTeacherDashboard(); break;
    case 'teacherCreate': renderTeacherCreate(); break;
    case 'teacherExamView': renderTeacherExamView(); break;
    case 'teacherStudentResult': renderTeacherStudentResult(); break;
    case 'studentExam': renderStudentExam(); break;
    case 'studentResult': renderStudentResult(); break;
    default: renderLanding();
  }
}

/* ============================= PWA / SERVICE WORKER ============================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

/* ============================= BOOT ============================= */
(function boot(){
  tryImportCfgFromUrl();
  if(state.examId){
    if(initFirebase()){ go('studentExam', {examId: state.examId}); }
    else {
      app.innerHTML = `${Header()}<div class="card">
        <p class="muted">هذا الرابط غير مكتمل من الناحية التقنية. يرجى التأكد من فتح الرابط الكامل الذي أرسله الأستاذ(ة)، وليس رمزًا مقتطعًا منه.</p>
        <button class="btn btn-primary" id="tryManual">العودة إلى قائمة الاختبارات</button>
      </div>`;
      document.getElementById('tryManual').onclick = ()=> go('landing');
    }
  } else {
    render();
  }
})();
</script>
